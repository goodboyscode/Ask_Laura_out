<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PrimeNest KE — Demo Landing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <h1 class="logo">PrimeNest <span>KE</span></h1>
    </header>

    <section id="joke-generator" class="section">
      <h2>Random Joke Generator</h2>
      <p>Click the button to fetch a random joke from an external API.</p>

      <div class="joke-box" aria-live="polite">
        <div id="joke-text" class="joke-text">—</div>
      </div>

      <div class="controls">
        <button id="new-joke" class="btn">Get a joke</button>
      </div>

      <p class="note">Powered by <a href="https://official-joke-api.appspot.com/" target="_blank" rel="noopener">Official Joke API</a>.</p>
    </section>

    <footer>
      <p>&copy; PrimeNest KE — Demo</p>
    </footer>
  </main>

  <script src="scripts/main.js" defer></script>
</body>
</html>
